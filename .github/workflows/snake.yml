name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kadertheexpert
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Upload Snake
        uses: actions/upload-artifact@v4
        with:
          name: snake
          path: dist
